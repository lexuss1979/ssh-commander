services:
  ssh-commander:
    build: .
    container_name: ssh-commander
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-admin}
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4.1-mini}
      - AI_MAX_STEPS=${AI_MAX_STEPS:-30}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
    volumes:
      - ./data:/data
      - ./keys:/keys
    restart: unless-stopped
