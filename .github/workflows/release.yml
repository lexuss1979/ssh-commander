name: Release image

on:
  push:
    tags: ['v*.*.*']
  # Повтор: выбрать существующий тег в Run workflow или Re-run failed jobs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check stable tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw Error('Stable vX.Y.Z tag required');
          for (const dir of ['server', 'web']) {
            for (const file of ['package.json', 'package-lock.json']) {
              const pkg = JSON.parse(fs.readFileSync(`${dir}/${file}`));
              if (pkg.version !== tag.slice(1)) throw Error(`${dir}/${file}: version mismatch`);
            }
          }
          const compose = fs.readFileSync('docker-compose.release.yml', 'utf8');
          if (!compose.includes(`image: ghcr.io/lexuss1979/ssh-commander:${tag.slice(1)}\n`)) throw Error('Compose version mismatch');
          JS
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and publish immutable version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-image.mjs
