# Include inside nginx's http {}. Run nginx on the Docker host.
map $http_upgrade $commander_connection {
    default upgrade;
    '' close;
}
server {
    listen 192.168.1.10:443 ssl;
    server_name commander.home.arpa;
    ssl_certificate /etc/nginx/tls/commander.crt;
    ssl_certificate_key /etc/nginx/tls/commander.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Match the TCP peer, not caller-controlled forwarding headers.
    # Do NOT enable real_ip_header here or in inherited http configuration.
    allow 192.168.1.25;
    # Alternatively: allow 192.168.1.0/24; (trusts every device in this subnet).
    deny all;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host commander.home.arpa;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $commander_connection;
        # Preserve the browser's Origin. Never synthesize an allowed Origin.
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
